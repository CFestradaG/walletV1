    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wallet GTQ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wallet — Finanzas Personales</title>
    <meta name="description" content="Aplicación de finanzas personales con períodos financieros configurables, cuentas, presupuestos y análisis." />
    <meta property="og:title" content="Wallet — Finanzas Personales" />
    <meta property="og:description" content="Aplicación de finanzas personales con períodos financieros configurables, cuentas, presupuestos y análisis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('wallet_theme_mode');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' ? prefersDark : (!mode ? true : false));
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#10B981]/30 selection:text-[#4EDEA3] transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
